<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="2; url=https://spotifymine.ai.studio">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .card {
    text-align: center;
    padding: 2.5rem 3rem;
    background: transparent;
    border: none;
    border-radius: 20px;
    backdrop-filter: none;
    box-shadow: none;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 1.25rem;
    border: 4px solid rgba(255, 0, 0, 0.2);
    border-top-color: #ff1a1a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    letter-spacing: 0.2px;
  }
  p {
    font-size: 0.9rem;
    opacity: 0.75;
  }
  a {
    color: #ff3b3b;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  noscript p { margin-top: 0.5rem; }
</style>
<script>
  setTimeout(function() {
    window.location.replace("https://spotifymine.ai.studio");
  }, 2000);
</script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting you now</h1>
    <p>If nothing happens, <a href="https://spotifymine.ai.studio">click here</a>.</p>
  </div>
  <noscript>
    <p>JavaScript is disabled — please use the link above.</p>
  </noscript>
</body>
</html>
