<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SpotifyMine — Standalone Music Player</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            spotify: {
              black: '#000000',
              base: '#121212',
              card: '#181818',
              cardHover: '#282828',
              green: '#1DB954',
              greenHover: '#1ed760',
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Keyframe Animations */
    @keyframes eqBounce {
      0%, 100% { transform: scaleY(0.3); }
      50%       { transform: scaleY(1.0); }
    }
    .eq-bar-1 { animation: eqBounce 0.8s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBounce 0.8s ease-in-out infinite 0.15s; }
    .eq-bar-3 { animation: eqBounce 0.8s ease-in-out infinite 0.3s; }
    .eq-bar-4 { animation: eqBounce 0.8s ease-in-out infinite 0.05s; }

    @keyframes lyricsBarPulse {
      0%, 100% { opacity: 1; transform: scaleY(1); }
      50%       { opacity: 0.5; transform: scaleY(0.65); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes heartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1.1); }
    }
    .animate-heart-pop { animation: heartPop 0.35s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards; }

    /* Custom Range Inputs */
    input[type='range'] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type='range']::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.2);
    }
    input[type='range']::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      margin-top: -4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
    }
    input[type='range']:hover::-webkit-slider-thumb {
      transform: scale(1.4);
      background: #1DB954;
    }
  </style>
</head>
<body class="bg-black text-white antialiased overflow-hidden select-none">
  <div id="root"></div>

  <!-- React Single File Application Bundle -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ── SVG Icon Helpers ──
    const IconPlay = ({ className = "w-5 h-5", fill = "currentColor" }) => (
      <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    );
    const IconPause = ({ className = "w-5 h-5", fill = "currentColor" }) => (
      <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    );
    const IconSkipBack = ({ className = "w-5 h-5", fill = "currentColor" }) => (
      <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="none"><polygon points="19 20 9 12 19 4 19 20"/><rect x="5" y="4" width="2" height="16"/></svg>
    );
    const IconSkipForward = ({ className = "w-5 h-5", fill = "currentColor" }) => (
      <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="none"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="2" height="16"/></svg>
    );
    const IconShuffle = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    );
    const IconRepeat = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    );
    const IconHeart = ({ className = "w-5 h-5", filled = false }) => (
      <svg className={className} viewBox="0 0 24 24" fill={filled ? "#1DB954" : "none"} stroke={filled ? "#1DB954" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    );
    const IconMic = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    );
    const IconList = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    );
    const IconVolume = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    );
    const IconVolumeMute = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    );
    const IconMaximize = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    );
    const IconSliders = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    );
    const IconChevronDown = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    );

    // ── Utilities & Hugging Face Proxy ──
    const HF_USER = "CoolJaat";
    const HF_REPO = "my-music-library";

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getStreamableAudioUrl(track) {
      return `/api/audio?user=${encodeURIComponent(HF_USER)}&repo=${encodeURIComponent(HF_REPO)}&file=${encodeURIComponent(track.path)}`;
    }

    function generateCoverArt(title = "", artist = "") {
      const colors = ['#1DB954', '#840032', '#004b23', '#2b2d42', '#3a0ca3'];
      const bg = colors[Math.abs((title.length + artist.length)) % colors.length];
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
        <rect width="300" height="300" fill="${bg}" />
        <circle cx="150" cy="120" r="45" fill="black" opacity="0.3"/>
        <text x="150" y="132" font-family="sans-serif" font-weight="900" font-size="36" fill="#FFF" text-anchor="middle">${(title[0] || '🎵').toUpperCase()}</text>
        <text x="150" y="195" font-family="sans-serif" font-weight="700" font-size="16" fill="#FFF" text-anchor="middle">${title.substring(0, 20)}</text>
        <text x="150" y="220" font-family="sans-serif" font-weight="500" font-size="13" fill="#FFF" opacity="0.8" text-anchor="middle">${artist.substring(0, 22)}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    // ── LRC Parser ──
    function parseLrc(lrcText) {
      if (!lrcText) return [];
      const lines = lrcText.split(/\r?\n/);
      const result = [];
      const timeRegex = /\[(\d{2,}):(\d{2})(?:[.:](\d{2,3}))?\]/g;
      lines.forEach((line) => {
        const trimmed = line.trim();
        if (!trimmed || /^\[(ar|ti|al|by):/i.test(trimmed)) return;
        const matches = Array.from(trimmed.matchAll(timeRegex));
        if (matches.length === 0) return;
        const text = trimmed.replace(timeRegex, '').trim();
        matches.forEach((match) => {
          const m = parseInt(match[1], 10);
          const s = parseInt(match[2], 10);
          const total = m * 60 + s;
          if (!isNaN(total) && text) {
            result.push({ id: `lrc_${total}_${Math.random()}`, time: total, text });
          }
        });
      });
      return result.sort((a, b) => a.time - b.time);
    }

    function getActiveLineIndex(lines, currentTime) {
      if (!lines || lines.length === 0) return -1;
      for (let i = lines.length - 1; i >= 0; i--) {
        if (currentTime >= lines[i].time) return i;
      }
      return -1;
    }

    // ── Realtime Audio Visualizer Component ──
    const RealtimeAudioVisualizer = ({ isPlaying, currentTime = 0, color = "#1DB954" }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = (canvas.width = canvas.parentElement?.clientWidth || 280);
        const height = (canvas.height = 36);
        const barCount = 36;
        const smoothHeights = new Float32Array(barCount);
        let animId;
        let phase = currentTime * 8;

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          phase += isPlaying ? 0.08 : 0.005;
          const gap = 3;
          const barWidth = Math.max(2, (width - gap * (barCount - 1)) / barCount);
          const halfH = height / 2;

          for (let i = 0; i < barCount; i++) {
            let val = 0.08;
            if (isPlaying) {
              val = 0.15 + Math.abs(Math.sin(phase + i * 0.28) * 0.45 + Math.cos(phase * 1.7 + i * 0.15) * 0.3);
            }
            smoothHeights[i] += (val - smoothHeights[i]) * 0.3;
            const barH = Math.max(4, smoothHeights[i] * height);
            const x = i * (barWidth + gap);
            const y = halfH - barH / 2;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, barWidth, barH, barWidth / 2);
            ctx.fill();
          }
          animId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animId);
      }, [isPlaying, currentTime, color]);

      return (
        <div className="w-full flex items-center justify-center overflow-hidden">
          <canvas ref={canvasRef} className="w-full block h-9" />
        </div>
      );
    };

    // ── Karaoke Lyrics View ──
    const LyricsView = ({ currentTrack, currentTime, isPlaying, onSeek }) => {
      const containerRef = useRef(null);
      const [autoScroll, setAutoScroll] = useState(true);

      const lyrics = useMemo(() => {
        if (!currentTrack || !currentTrack.lrc) return [];
        const parsed = parseLrc(currentTrack.lrc);
        if (parsed.length === 0) return [];
        const res = [];
        if (parsed[0].time > 3) res.push({ id: 'lrc_intro', time: 0, text: '.....' });
        for (let i = 0; i < parsed.length; i++) {
          res.push(parsed[i]);
          if (i < parsed.length - 1 && parsed[i + 1].time - parsed[i].time > 7) {
            res.push({ id: `lrc_gap_${i}`, time: parsed[i].time + 2.5, text: '.....' });
          }
        }
        return res;
      }, [currentTrack]);

      const activeIndex = useMemo(() => getActiveLineIndex(lyrics, currentTime), [lyrics, currentTime]);

      useEffect(() => {
        if (!autoScroll || activeIndex < 0 || !containerRef.current) return;
        const el = containerRef.current.querySelector(`[data-lyric-idx="${activeIndex}"]`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, [activeIndex, autoScroll]);

      if (!currentTrack) return <div className="p-8 text-center text-zinc-500">No track selected</div>;

      const trackColor = (currentTrack.gradientColors && currentTrack.gradientColors[0]) || '#1DB954';

      return (
        <div className="relative flex flex-col h-full w-full rounded-3xl overflow-hidden shadow-2xl select-none" style={{ background: `radial-gradient(circle at 50% 25%, ${trackColor}55 0%, #0d0d0d 85%)` }}>
          <div className="relative z-10 flex items-center justify-between px-6 py-4 border-b border-white/10 bg-black/40 backdrop-blur-md">
            <div className="flex items-center gap-3">
              <img src={currentTrack.coverArtUrl || generateCoverArt(currentTrack.title, currentTrack.artist)} className="w-10 h-10 rounded-lg object-cover shadow" />
              <div>
                <p className="text-sm font-bold text-white truncate">{currentTrack.title}</p>
                <p className="text-xs text-zinc-400 truncate">{currentTrack.artist}</p>
              </div>
            </div>
          </div>

          <div ref={containerRef} className="relative z-10 flex-1 overflow-y-auto px-6 sm:px-12 py-20 space-y-4 custom-scrollbar">
            {lyrics.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full text-center">
                <p className="text-3xl font-black text-[#1DB954] animate-pulse mb-2">. . . . .</p>
                <p className="text-base font-bold text-zinc-300">No lyrics available</p>
              </div>
            ) : (
              lyrics.map((line, idx) => {
                const isActive = idx === activeIndex;
                const isPassed = idx < activeIndex;
                return (
                  <div
                    key={line.id}
                    data-lyric-idx={idx}
                    onClick={() => { onSeek(line.time); setAutoScroll(true); }}
                    className="group cursor-pointer transition-all duration-300 rounded-2xl px-5 py-3 relative"
                    style={{
                      opacity: isActive ? 1 : isPassed ? 0.6 : 0.3,
                      transform: isActive ? 'scale(1.03)' : 'scale(0.98)',
                    }}
                  >
                    <div className="flex items-center justify-between">
                      <p className="leading-snug text-left" style={{ fontSize: isActive ? '30px' : '22px', fontWeight: isActive ? 900 : 700, color: isActive ? '#ffffff' : '#d4d4d8' }}>
                        {line.text === '.....' ? <span className="text-[#1DB954] font-black tracking-widest text-3xl animate-pulse">. . . . .</span> : line.text}
                      </p>
                      <div className="opacity-0 group-hover:opacity-100 flex items-center gap-1 px-3 py-1 rounded-full bg-white/10 text-xs font-bold text-white">
                        <IconPlay className="w-3 h-3 fill-[#1DB954]" /> Seek
                      </div>
                    </div>
                  </div>
                );
              })
            )}
            <div className="pt-12 text-center text-xs text-zinc-500 uppercase tracking-widest">Lyrics provided by SpotifyMine</div>
          </div>

          <div className="relative z-10 p-4 border-t border-white/10 bg-black/40 flex items-center justify-between">
            <div className="flex-1 max-w-sm px-2">
              <RealtimeAudioVisualizer isPlaying={isPlaying} currentTime={currentTime} color={trackColor} />
            </div>
          </div>
        </div>
      );
    };

    // ── Full-Screen Player Modal ──
    const ExpandedNowPlayingModal = ({ isOpen, onClose, currentTrack, isPlaying, currentTime, duration, volume, isMuted, isShuffle, repeatMode, isLiked, crossfadeDuration, onCrossfadeChange, onPlayPause, onPrevTrack, onNextTrack, onSeek, onVolumeChange, onToggleMute, onToggleShuffle, onToggleRepeat, onToggleLike, userQueue, queue, onClearQueue, onPlayTrack }) => {
      const [activeTab, setActiveTab] = useState('art');
      const [showQueue, setShowQueue] = useState(false);
      const [showCrossfade, setShowCrossfade] = useState(false);

      if (!isOpen || !currentTrack) return null;

      const trackColor = (currentTrack.gradientColors && currentTrack.gradientColors[0]) || '#1DB954';
      const coverArt = currentTrack.coverArtUrl || generateCoverArt(currentTrack.title, currentTrack.artist);

      return (
        <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-3xl flex flex-col overflow-hidden animate-fade-up">
          {/* Header */}
          <div className="flex items-center justify-between px-6 py-4 border-b border-zinc-800">
            <button onClick={onClose} className="p-2 text-zinc-400 hover:text-white rounded-full hover:bg-zinc-800"><IconChevronDown className="w-7 h-7"/></button>
            <div className="flex bg-zinc-900 p-1 rounded-full border border-zinc-800">
              <button onClick={() => setActiveTab('art')} className={`px-4 py-1.5 rounded-full text-xs font-bold ${activeTab === 'art' ? 'bg-[#1DB954] text-black' : 'text-zinc-400'}`}>Artwork</button>
              <button onClick={() => setActiveTab('lyrics')} className={`px-4 py-1.5 rounded-full text-xs font-bold ${activeTab === 'lyrics' ? 'bg-[#1DB954] text-black' : 'text-zinc-400'}`}>Lyrics</button>
            </div>
            <button onClick={() => setShowQueue(!showQueue)} className={`p-2 rounded-full ${showQueue ? 'text-[#1DB954]' : 'text-zinc-400'}`}><IconList className="w-6 h-6"/></button>
          </div>

          {/* Body */}
          <div className="flex-1 flex items-center justify-center p-6 overflow-hidden relative">
            {activeTab === 'art' ? (
              <div className="flex flex-col items-center max-w-md w-full space-y-6">
                <div className="w-80 h-80 rounded-3xl overflow-hidden shadow-2xl border border-zinc-800">
                  <img src={coverArt} className="w-full h-full object-cover" />
                </div>
                <div className="w-full flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-black text-white truncate">{currentTrack.title}</h2>
                    <p className="text-sm font-semibold text-zinc-400 truncate">{currentTrack.artist}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setShowCrossfade(!showCrossfade)} className={`p-3 rounded-full ${crossfadeDuration > 0 ? 'text-[#1DB954] bg-[#1DB954]/20' : 'text-zinc-400 bg-zinc-800'}`}><IconSliders className="w-5 h-5"/></button>
                    <button onClick={(e) => onToggleLike(currentTrack.id, e)} className="p-3 text-zinc-400 hover:text-white"><IconHeart className="w-7 h-7" filled={isLiked}/></button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="w-full h-full max-w-2xl mx-auto">
                <LyricsView currentTrack={currentTrack} currentTime={currentTime} isPlaying={isPlaying} onSeek={onSeek} />
              </div>
            )}

            {/* Queue Drawer */}
            {showQueue && (
              <div className="absolute right-0 top-0 bottom-0 w-full sm:w-96 bg-zinc-950 border-l border-zinc-800 p-6 flex flex-col z-30 shadow-2xl animate-fade-up">
                <div className="flex items-center justify-between pb-4 border-b border-zinc-800 mb-4">
                  <h3 className="font-bold text-white text-lg">Next in Queue</h3>
                  <button onClick={() => setShowQueue(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar">
                  {(userQueue.concat(queue)).map((t, i) => (
                    <div key={i} onClick={() => onPlayTrack(t)} className="flex items-center gap-3 p-2 rounded-lg hover:bg-zinc-800 cursor-pointer">
                      <img src={t.coverArtUrl || generateCoverArt(t.title, t.artist)} className="w-10 h-10 rounded object-cover" />
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-bold text-white truncate">{t.title}</p>
                        <p className="text-xs text-zinc-400 truncate">{t.artist}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Transport Controls */}
          <div className="p-6 bg-zinc-950 border-t border-zinc-800 flex flex-col gap-4 max-w-xl mx-auto w-full">
            <div className="space-y-1">
              <input type="range" min={0} max={duration || 100} value={currentTime} onChange={(e) => handleSeek(parseFloat(e.target.value))} className="w-full" />
              <div className="flex justify-between text-xs font-mono text-zinc-400">
                <span>{formatTime(currentTime)}</span>
                <span>{formatTime(duration)}</span>
              </div>
            </div>

            <div className="flex items-center justify-between">
              <button onClick={onToggleShuffle} className={isShuffle ? 'text-[#1DB954]' : 'text-zinc-400'}><IconShuffle className="w-5 h-5"/></button>
              <div className="flex items-center gap-6">
                <button onClick={onPrevTrack} className="text-zinc-300 hover:text-white"><IconSkipBack className="w-7 h-7"/></button>
                <button onClick={onPlayPause} className="w-16 h-16 rounded-full bg-[#1DB954] text-black flex items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition-all">
                  {isPlaying ? <IconPause className="w-8 h-8 fill-black" /> : <IconPlay className="w-8 h-8 fill-black translate-x-0.5" />}
                </button>
                <button onClick={onNextTrack} className="text-zinc-300 hover:text-white"><IconSkipForward className="w-7 h-7"/></button>
              </div>
              <button onClick={onToggleRepeat} className={repeatMode !== 'off' ? 'text-[#1DB954]' : 'text-zinc-400'}><IconRepeat className="w-5 h-5"/></button>
            </div>
          </div>
        </div>
      );
    };

    // ── Main Application Component ──
    const App = () => {
      const [tracks, setTracks] = useState([]);
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const [isShuffle, setIsShuffle] = useState(false);
      const [repeatMode, setRepeatMode] = useState('off');
      const [likedTrackIds, setLikedTrackIds] = useState([]);
      const [activeTab, setActiveTab] = useState('home');
      const [crossfadeDuration, setCrossfadeDuration] = useState(4);
      const [isMaximized, setIsMaximized] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [userQueue, setUserQueue] = useState([]);

      const audioRefA = useRef(new Audio());
      const audioRefB = useRef(new Audio());
      const activeDeckRef = useRef('A');
      const isCrossfadingRef = useRef(false);
      const crossfadeTriggeredRef = useRef(false);

      // Fetch Hugging Face Songs Catalog
      useEffect(() => {
        fetch(`/api/hf-tree?user=${HF_USER}&repo=${HF_REPO}`)
          .then((res) => res.json())
          .then((data) => {
            if (data && data.tracks && data.tracks.length > 0) {
              const loaded = data.tracks.map((t, idx) => ({
                id: t.id || `track_${idx}`,
                title: t.title || t.path.split('/').pop().replace(/\.[^/.]+$/, ''),
                artist: t.artist || 'CoolJaat',
                album: t.album || 'Hugging Face Library',
                path: t.path,
                audioUrl: t.audioUrl,
                duration: t.duration || 180,
                coverArtUrl: generateCoverArt(t.title, t.artist),
                gradientColors: ['#1DB954', '#121212'],
                lrc: t.lrc || null,
              }));
              setTracks(loaded);
              setCurrentTrack(loaded[0]);
            }
          })
          .catch((err) => console.error('Catalog fetch error:', err));
      }, []);

      // Dual Deck Volume Sync
      const syncVolumes = useCallback(() => {
        const eff = isMuted ? 0 : volume;
        if (!isCrossfadingRef.current) {
          const activeAudio = activeDeckRef.current === 'A' ? audioRefA.current : audioRefB.current;
          const inactiveAudio = activeDeckRef.current === 'A' ? audioRefB.current : audioRefA.current;
          if (activeAudio) activeAudio.volume = eff;
          if (inactiveAudio) inactiveAudio.volume = 0;
        }
      }, [volume, isMuted]);

      useEffect(() => { syncVolumes(); }, [volume, isMuted, syncVolumes]);

      // Crossfade Transition Engine
      const startCrossfade = useCallback((nextTrack) => {
        const outgoingDeck = activeDeckRef.current;
        const incomingDeck = outgoingDeck === 'A' ? 'B' : 'A';
        const outgoingAudio = outgoingDeck === 'A' ? audioRefA.current : audioRefB.current;
        const incomingAudio = incomingDeck === 'A' ? audioRefA.current : audioRefB.current;

        if (!incomingAudio) return;

        isCrossfadingRef.current = true;
        activeDeckRef.current = incomingDeck;

        incomingAudio.src = getStreamableAudioUrl(nextTrack);
        incomingAudio.currentTime = 0;

        setCurrentTrack(nextTrack);
        setCurrentTime(0);
        setDuration(nextTrack.duration || 0);

        incomingAudio.play().then(() => {
          setIsPlaying(true);
          const startTime = performance.now();
          const fadeMs = crossfadeDuration * 1000;

          const animate = (now) => {
            const progress = Math.min(1, (now - startTime) / fadeMs);
            const eff = isMuted ? 0 : volume;
            const outVol = Math.cos(progress * 0.5 * Math.PI) * eff;
            const inVol = Math.sin(progress * 0.5 * Math.PI) * eff;

            if (incomingDeck === 'A') {
              audioRefA.current.volume = inVol;
              audioRefB.current.volume = outVol;
            } else {
              audioRefA.current.volume = outVol;
              audioRefB.current.volume = inVol;
            }

            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              if (outgoingAudio) { outgoingAudio.pause(); outgoingAudio.currentTime = 0; }
              isCrossfadingRef.current = false;
              crossfadeTriggeredRef.current = false;
            }
          };
          requestAnimationFrame(animate);
        }).catch(err => console.error('Crossfade play error:', err));
      }, [crossfadeDuration, volume, isMuted]);

      // Audio Event Handlers
      useEffect(() => {
        const handleTimeUpdate = (deck) => {
          if (deck === activeDeckRef.current) {
            const audio = deck === 'A' ? audioRefA.current : audioRefB.current;
            setCurrentTime(audio.currentTime);

            // Auto 4s crossfade trigger
            if (
              crossfadeDuration > 0 &&
              !isCrossfadingRef.current &&
              !crossfadeTriggeredRef.current &&
              audio.duration > 0 &&
              audio.duration - audio.currentTime <= crossfadeDuration &&
              audio.duration - audio.currentTime > 0.3
            ) {
              crossfadeTriggeredRef.current = true;
              const nextIdx = (tracks.findIndex(t => t.id === currentTrack?.id) + 1) % tracks.length;
              const nextTrack = tracks[nextIdx];
              if (nextTrack) startCrossfade(nextTrack);
            }
          }
        };

        const handleLoadedMetadata = (deck) => {
          if (deck === activeDeckRef.current) {
            const audio = deck === 'A' ? audioRefA.current : audioRefB.current;
            setDuration(audio.duration || 0);
          }
        };

        const onTimeA = () => handleTimeUpdate('A');
        const onTimeB = () => handleTimeUpdate('B');
        const onMetaA = () => handleLoadedMetadata('A');
        const onMetaB = () => handleLoadedMetadata('B');

        const a = audioRefA.current;
        const b = audioRefB.current;

        a.addEventListener('timeupdate', onTimeA);
        b.addEventListener('timeupdate', onTimeB);
        a.addEventListener('loadedmetadata', onMetaA);
        b.addEventListener('loadedmetadata', onMetaB);

        return () => {
          a.removeEventListener('timeupdate', onTimeA);
          b.removeEventListener('timeupdate', onTimeB);
          a.removeEventListener('loadedmetadata', onMetaA);
          b.removeEventListener('loadedmetadata', onMetaB);
        };
      }, [tracks, currentTrack, crossfadeDuration, startCrossfade]);

      const handlePlayTrack = (track) => {
        setCurrentTrack(track);
        setCurrentTime(0);
        const activeAudio = activeDeckRef.current === 'A' ? audioRefA.current : audioRefB.current;
        activeAudio.src = getStreamableAudioUrl(track);
        activeAudio.currentTime = 0;
        activeAudio.play().then(() => setIsPlaying(true)).catch(err => console.error(err));
      };

      const handlePlayPause = () => {
        const activeAudio = activeDeckRef.current === 'A' ? audioRefA.current : audioRefB.current;
        if (isPlaying) {
          activeAudio.pause();
          setIsPlaying(false);
        } else {
          activeAudio.play().then(() => setIsPlaying(true)).catch(err => console.error(err));
        }
      };

      const handleNext = () => {
        if (tracks.length === 0) return;
        const idx = tracks.findIndex(t => t.id === currentTrack?.id);
        const next = tracks[(idx + 1) % tracks.length];
        if (crossfadeDuration > 0 && isPlaying) {
          startCrossfade(next);
        } else {
          handlePlayTrack(next);
        }
      };

      const handlePrev = () => {
        if (tracks.length === 0) return;
        const idx = tracks.findIndex(t => t.id === currentTrack?.id);
        const prev = tracks[(idx - 1 + tracks.length) % tracks.length];
        handlePlayTrack(prev);
      };

      const handleSeek = (time) => {
        const activeAudio = activeDeckRef.current === 'A' ? audioRefA.current : audioRefB.current;
        activeAudio.currentTime = time;
        setCurrentTime(time);
      };

      const filteredTracks = useMemo(() => {
        if (!searchQuery.trim()) return tracks;
        const q = searchQuery.toLowerCase();
        return tracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
      }, [tracks, searchQuery]);

      return (
        <div className="flex flex-col h-screen w-screen bg-black text-white font-sans overflow-hidden">
          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar */}
            <aside className="w-64 bg-black p-6 flex flex-col gap-6 hidden md:flex border-r border-zinc-900 shrink-0 select-none">
              <div className="flex items-center gap-2 text-white font-black text-xl tracking-tight">
                <span className="w-8 h-8 rounded-full bg-[#1DB954] flex items-center justify-center text-black font-black text-xs">SM</span>
                <span>Spotify<span className="text-[#1DB954]">Mine</span></span>
              </div>

              <nav className="space-y-3 font-bold text-sm">
                <button onClick={() => setActiveTab('home')} className={`w-full flex items-center gap-4 px-3 py-2 rounded-lg transition-all ${activeTab === 'home' ? 'text-white bg-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Home</button>
                <button onClick={() => setActiveTab('search')} className={`w-full flex items-center gap-4 px-3 py-2 rounded-lg transition-all ${activeTab === 'search' ? 'text-white bg-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Search</button>
                <button onClick={() => setActiveTab('lyrics')} className={`w-full flex items-center gap-4 px-3 py-2 rounded-lg transition-all ${activeTab === 'lyrics' ? 'text-white bg-zinc-900' : 'text-zinc-400 hover:text-white'}`}>Karaoke Lyrics</button>
              </nav>

              <div className="flex-1 overflow-y-auto custom-scrollbar border-t border-zinc-900 pt-4">
                <p className="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3">Your Library</p>
                <div className="space-y-1">
                  {tracks.slice(0, 15).map(t => (
                    <div key={t.id} onClick={() => handlePlayTrack(t)} className="flex items-center gap-3 p-2 rounded-md hover:bg-zinc-900 cursor-pointer">
                      <img src={t.coverArtUrl} className="w-8 h-8 rounded object-cover" />
                      <div className="min-w-0 flex-1">
                        <p className="text-xs font-bold text-white truncate">{t.title}</p>
                        <p className="text-[10px] text-zinc-400 truncate">{t.artist}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 bg-[#121212] flex flex-col min-w-0 overflow-hidden">
              <header className="px-6 py-4 bg-[#121212]/80 backdrop-blur-md border-b border-zinc-800/40 flex items-center justify-between shrink-0">
                <div className="flex items-center gap-4 flex-1 max-w-md">
                  {activeTab === 'search' && (
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="What do you want to listen to?"
                      className="w-full bg-zinc-800 border border-[#1DB954] rounded-full px-4 py-2 text-xs text-white placeholder-zinc-400 focus:outline-none"
                    />
                  )}
                </div>
                <div className="flex items-center gap-3">
                  <span className="text-xs font-bold text-zinc-400">Welcome, Listener</span>
                  <div className="w-8 h-8 rounded-full bg-[#1DB954] text-black font-extrabold flex items-center justify-center text-xs">U</div>
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-6 custom-scrollbar animate-fade-up">
                {activeTab === 'lyrics' ? (
                  <div className="h-full max-w-4xl mx-auto">
                    <LyricsView currentTrack={currentTrack} currentTime={currentTime} isPlaying={isPlaying} onSeek={handleSeek} />
                  </div>
                ) : (
                  <div className="space-y-8">
                    <div>
                      <h1 className="text-3xl font-black text-white mb-6">Featured Songs</h1>
                      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {filteredTracks.map(t => (
                          <div
                            key={t.id}
                            onClick={() => handlePlayTrack(t)}
                            className="group relative bg-[#181818] hover:bg-[#282828] p-3.5 rounded-xl cursor-pointer transition-all duration-300 hover:-translate-y-1.5 hover:shadow-2xl"
                          >
                            <div className="relative aspect-square w-full rounded-lg overflow-hidden mb-3">
                              <img src={t.coverArtUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                              <button className="absolute bottom-2 right-2 w-10 h-10 rounded-full bg-[#1DB954] text-black flex items-center justify-center shadow-xl opacity-0 group-hover:opacity-100 transition-all duration-200 translate-y-2 group-hover:translate-y-0">
                                <IconPlay className="w-4 h-4 fill-black translate-x-0.5" />
                              </button>
                            </div>
                            <h3 className="font-bold text-sm text-white truncate">{t.title}</h3>
                            <p className="text-xs text-zinc-400 truncate mt-1">{t.artist}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </main>
          </div>

          {/* Player Bar */}
          {currentTrack && (
            <footer className="h-24 bg-[#181818] border-t border-zinc-800 px-4 flex items-center justify-between shrink-0 select-none">
              {/* Left Track Info */}
              <div className="flex items-center gap-3 w-1/4 min-w-[180px]">
                <img src={currentTrack.coverArtUrl} className="w-14 h-14 rounded-lg object-cover shadow cursor-pointer" onClick={() => setIsMaximized(true)} />
                <div className="min-w-0 cursor-pointer" onClick={() => setIsMaximized(true)}>
                  <p className="text-sm font-bold text-white truncate hover:underline">{currentTrack.title}</p>
                  <p className="text-xs text-zinc-400 truncate hover:underline">{currentTrack.artist}</p>
                </div>
                <button onClick={() => setLikedTrackIds(prev => prev.includes(currentTrack.id) ? prev.filter(i => i !== currentTrack.id) : [...prev, currentTrack.id])} className="p-2 text-zinc-400 hover:text-white">
                  <IconHeart className="w-5 h-5" filled={likedTrackIds.includes(currentTrack.id)} />
                </button>
              </div>

              {/* Center Controls */}
              <div className="flex flex-col items-center gap-2 w-2/4 max-w-xl">
                <div className="flex items-center gap-6">
                  <button onClick={() => setIsShuffle(!isShuffle)} className={isShuffle ? 'text-[#1DB954]' : 'text-zinc-400'}><IconShuffle className="w-4 h-4"/></button>
                  <button onClick={handlePrev} className="text-zinc-300 hover:text-white"><IconSkipBack className="w-5 h-5"/></button>
                  <button onClick={handlePlayPause} className="w-10 h-10 rounded-full bg-white text-[#121212] flex items-center justify-center shadow hover:scale-105 active:scale-95 transition-all">
                    {isPlaying ? <IconPause className="w-5 h-5 fill-[#121212]" /> : <IconPlay className="w-5 h-5 fill-[#121212] translate-x-0.5" />}
                  </button>
                  <button onClick={handleNext} className="text-zinc-300 hover:text-white"><IconSkipForward className="w-5 h-5"/></button>
                  <button onClick={() => setRepeatMode(prev => prev === 'off' ? 'all' : 'off')} className={repeatMode !== 'off' ? 'text-[#1DB954]' : 'text-zinc-400'}><IconRepeat className="w-4 h-4"/></button>
                </div>

                <div className="flex items-center gap-2 w-full">
                  <span className="text-xs font-mono text-zinc-400 w-10 text-right">{formatTime(currentTime)}</span>
                  <input type="range" min={0} max={duration || 100} value={currentTime} onChange={(e) => handleSeek(parseFloat(e.target.value))} className="flex-1" />
                  <span className="text-xs font-mono text-zinc-400 w-10">{formatTime(duration)}</span>
                </div>
              </div>

              {/* Right Options */}
              <div className="flex items-center justify-end gap-3 w-1/4">
                <button onClick={() => setActiveTab('lyrics')} className={`p-2 ${activeTab === 'lyrics' ? 'text-[#1DB954]' : 'text-zinc-400'}`}><IconMic className="w-4 h-4"/></button>
                <button onClick={() => setIsMuted(!isMuted)} className="p-2 text-zinc-400 hover:text-white">
                  {isMuted || volume === 0 ? <IconVolumeMute className="w-4 h-4 text-red-400"/> : <IconVolume className="w-4 h-4"/>}
                </button>
                <input type="range" min={0} max={1} step={0.01} value={isMuted ? 0 : volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="w-20" />
                <button onClick={() => setIsMaximized(true)} className="p-2 text-zinc-400 hover:text-white"><IconMaximize className="w-4 h-4"/></button>
              </div>
            </footer>
          )}

          {/* Full Screen Player Modal */}
          <ExpandedNowPlayingModal
            isOpen={isMaximized}
            onClose={() => setIsMaximized(false)}
            currentTrack={currentTrack}
            isPlaying={isPlaying}
            currentTime={currentTime}
            duration={duration}
            volume={volume}
            isMuted={isMuted}
            isShuffle={isShuffle}
            repeatMode={repeatMode}
            isLiked={likedTrackIds.includes(currentTrack?.id)}
            crossfadeDuration={crossfadeDuration}
            onCrossfadeChange={setCrossfadeDuration}
            onPlayPause={handlePlayPause}
            onPrevTrack={handlePrev}
            onNextTrack={handleNext}
            onSeek={handleSeek}
            onVolumeChange={setVolume}
            onToggleMute={() => setIsMuted(!isMuted)}
            onToggleShuffle={() => setIsShuffle(!isShuffle)}
            onToggleRepeat={() => setRepeatMode(prev => prev === 'off' ? 'all' : 'off')}
            onToggleLike={() => setLikedTrackIds(prev => prev.includes(currentTrack.id) ? prev.filter(i => i !== currentTrack.id) : [...prev, currentTrack.id])}
            userQueue={userQueue}
            queue={tracks}
            onPlayTrack={handlePlayTrack}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
